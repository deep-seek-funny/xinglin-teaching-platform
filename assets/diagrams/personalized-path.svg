<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" width="1200" height="430">
  <rect width="1200" height="430" fill="#F7F5F0"/>
  <text x="60" y="60" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="27" font-weight="700" fill="#101B2A">个性化路径：从"一个分数"到"下一步做什么"</text>
  <text x="60" y="90" font-family="Microsoft YaHei, sans-serif" font-size="13.5" fill="#6E7C8A">判断"练过但没成型"的那一项，而不是最简单或最难的</text>

  <defs>
    <marker id="p1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0E7C6B"/>
    </marker>
  </defs>

  <g font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#101B2A" text-anchor="middle">
    <rect x="60" y="130" width="220" height="96" rx="10" fill="#FFFFFF" stroke="#2F6FB0"/>
    <text x="170" y="162" font-size="16" font-weight="700" fill="#2F6FB0">① 证据</text>
    <text x="170" y="188" font-size="12" fill="#2A3648">按人、按模块汇总记录</text>
    <text x="170" y="208" font-size="11" fill="#6E7C8A">原话 / 第几次 / 分数 / 版本</text>

    <rect x="330" y="130" width="220" height="96" rx="10" fill="#FFFFFF" stroke="#C08A2E"/>
    <text x="440" y="162" font-size="16" font-weight="700" fill="#C08A2E">② 短板</text>
    <text x="440" y="188" font-size="12" fill="#2A3648">找"练过但没成型"的一项</text>
    <text x="440" y="208" font-size="11" fill="#6E7C8A">结合错点与节点覆盖</text>

    <rect x="600" y="130" width="240" height="96" rx="10" fill="#F8EFDF" stroke="#C08A2E"/>
    <text x="720" y="162" font-size="16" font-weight="700" fill="#8A5A1E">③ 任务卡</text>
    <text x="720" y="188" font-size="12" fill="#2A3648">先补哪章 · 做什么 · 做到什么算过</text>
    <text x="720" y="208" font-size="11" fill="#8A5A1E">有任务、有时限、有验收</text>

    <rect x="890" y="130" width="250" height="96" rx="10" fill="#FFFFFF" stroke="#0E7C6B"/>
    <text x="1015" y="162" font-size="16" font-weight="700" fill="#0E7C6B">④ 验收 → 新证据</text>
    <text x="1015" y="188" font-size="12" fill="#2A3648">完成情况回到证据库</text>
    <text x="1015" y="208" font-size="11" fill="#6E7C8A">下一轮再判断，形成闭环</text>
  </g>
  <line x1="280" y1="178" x2="326" y2="178" stroke="#0E7C6B" stroke-width="2" marker-end="url(#p1)"/>
  <line x1="550" y1="178" x2="596" y2="178" stroke="#0E7C6B" stroke-width="2" marker-end="url(#p1)"/>
  <line x1="840" y1="178" x2="886" y2="178" stroke="#0E7C6B" stroke-width="2" marker-end="url(#p1)"/>

  <path d="M 1015 226 L 1015 268 L 170 268 L 170 230" fill="none" stroke="#0E7C6B" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#p1)"/>
  <text x="590" y="292" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#0E7C6B" text-anchor="middle">闭环：越转越准</text>

  <rect x="60" y="322" width="1080" height="80" rx="8" fill="#FFFFFF" stroke="#DADFD9"/>
  <text x="86" y="350" font-family="Microsoft YaHei, sans-serif" font-size="12.5" font-weight="700" fill="#101B2A">一个真实例子</text>
  <text x="86" y="376" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#2A3648">问诊 83 分（不错），但建造图谱只有 121 分（全班最高 522）→ 问题不在嘴上，在于把机制讲成"结论"而不是"因果链"。</text>
  <text x="86" y="396" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#0E7C6B">任务卡：本周补齐「发生机制 → 筛查 → 诊断」三级关系 ≥8 条，目标 300 分；验收：能用自己的图谱讲清"为什么 NIPT 只是筛查"。</text>
</svg>
