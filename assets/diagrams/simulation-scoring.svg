<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640">
  <rect width="1200" height="640" fill="#F7F5F0"/>
  <text x="60" y="62" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="28" font-weight="700" fill="#101B2A">模拟问诊：两条链路 + 一次评分</text>
  <text x="60" y="92" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#6E7C8A">思考模式练"想清楚再说"；实时模式练"边说边接"；评分不看模式，看证据</text>

  <!-- 思考模式 -->
  <text x="60" y="136" font-family="Microsoft YaHei, sans-serif" font-size="15" font-weight="700" fill="#0E7C6B">A · 思考模式（逐句推进）</text>
  <defs>
    <marker id="t2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0E7C6B"/>
    </marker>
  </defs>
  <g font-family="Microsoft YaHei, sans-serif" font-size="12.5" fill="#101B2A" text-anchor="middle">
    <rect x="60" y="152" width="128" height="56" rx="8" fill="#FFFFFF" stroke="#0E7C6B"/><text x="124" y="176">学生录音</text><text x="124" y="196" font-size="11" fill="#6E7C8A">按住说话</text>
    <rect x="216" y="152" width="128" height="56" rx="8" fill="#FFFFFF" stroke="#0E7C6B"/><text x="280" y="176">ASR 转写</text><text x="280" y="196" font-size="11" fill="#6E7C8A">豆包流式识别</text>
    <rect x="372" y="152" width="150" height="56" rx="8" fill="#103A35" stroke="#0E7C6B"/><text x="447" y="176" fill="#FFFFFF">文本模型（患者）</text><text x="447" y="196" font-size="11" fill="#9FD6C6">DeepSeek + 病例约束</text>
    <rect x="550" y="152" width="128" height="56" rx="8" fill="#FFFFFF" stroke="#0E7C6B"/><text x="614" y="176">TTS 合成</text><text x="614" y="196" font-size="11" fill="#6E7C8A">豆包语音 2.0</text>
    <rect x="706" y="152" width="140" height="56" rx="8" fill="#FFFFFF" stroke="#0E7C6B"/><text x="776" y="176">播放 + 下一轮</text><text x="776" y="196" font-size="11" fill="#6E7C8A">清单同步推进</text>
  </g>
  <line x1="188" y1="180" x2="212" y2="180" stroke="#0E7C6B" stroke-width="2" marker-end="url(#t2)"/>
  <line x1="344" y1="180" x2="368" y2="180" stroke="#0E7C6B" stroke-width="2" marker-end="url(#t2)"/>
  <line x1="522" y1="180" x2="546" y2="180" stroke="#0E7C6B" stroke-width="2" marker-end="url(#t2)"/>
  <line x1="678" y1="180" x2="702" y2="180" stroke="#0E7C6B" stroke-width="2" marker-end="url(#t2)"/>

  <!-- 实时模式 -->
  <text x="60" y="262" font-family="Microsoft YaHei, sans-serif" font-size="15" font-weight="700" fill="#2F6FB0">B · 实时模式（全双工，可打断）</text>
  <defs>
    <marker id="t3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2F6FB0"/>
    </marker>
  </defs>
  <g font-family="Microsoft YaHei, sans-serif" font-size="12.5" fill="#101B2A" text-anchor="middle">
    <rect x="60" y="278" width="150" height="60" rx="8" fill="#FFFFFF" stroke="#2F6FB0"/><text x="135" y="303">浏览器</text><text x="135" y="323" font-size="11" fill="#6E7C8A">麦克风 / 扬声器</text>
    <rect x="252" y="278" width="170" height="60" rx="8" fill="#F3F6F9" stroke="#2F6FB0"/><text x="337" y="303">长连接网关</text><text x="337" y="323" font-size="11" fill="#6E7C8A">鉴权 + 注入病例约束</text>
    <rect x="464" y="278" width="200" height="60" rx="8" fill="#1E3952" stroke="#2F6FB0"/><text x="564" y="303" fill="#FFFFFF">实时语音模型（豆包）</text><text x="564" y="323" font-size="11" fill="#9FB1C4">pcm 16k 入 / pcm 24k 出</text>
    <rect x="706" y="278" width="220" height="60" rx="8" fill="#FFFFFF" stroke="#2F6FB0"/><text x="816" y="303">事件与二进制帧双向</text><text x="816" y="323" font-size="11" fill="#6E7C8A">约 25s 心跳 · 违规检测</text>
  </g>
  <line x1="210" y1="308" x2="248" y2="308" stroke="#2F6FB0" stroke-width="2" marker-end="url(#t3)"/>
  <line x1="422" y1="308" x2="460" y2="308" stroke="#2F6FB0" stroke-width="2" marker-end="url(#t3)"/>
  <line x1="664" y1="308" x2="702" y2="308" stroke="#2F6FB0" stroke-width="2" marker-end="url(#t3)"/>
  <text x="60" y="362" font-family="Microsoft YaHei, sans-serif" font-size="11.5" fill="#6E7C8A">违规判定：每约 4 秒抽样学生音频，与患者/助手音色比对（阈值约 0.5），连续命中记"AI 代答"</text>

  <!-- 评分 -->
  <text x="60" y="418" font-family="Microsoft YaHei, sans-serif" font-size="15" font-weight="700" fill="#C08A2E">C · 评分：四个独立评委 + 一次综合</text>
  <g font-family="Microsoft YaHei, sans-serif" font-size="12.5" fill="#101B2A" text-anchor="middle">
    <rect x="60" y="438" width="176" height="72" rx="8" fill="#FFFFFF" stroke="#DADFD9"/><text x="148" y="466">专业医师</text><text x="148" y="488" font-size="18" font-weight="700" fill="#C08A2E">40%</text>
    <rect x="252" y="438" width="176" height="72" rx="8" fill="#FFFFFF" stroke="#DADFD9"/><text x="340" y="466">敏感型患者</text><text x="340" y="488" font-size="18" font-weight="700" fill="#C08A2E">25%</text>
    <rect x="444" y="438" width="176" height="72" rx="8" fill="#FFFFFF" stroke="#DADFD9"/><text x="532" y="466">坚强型患者</text><text x="532" y="488" font-size="18" font-weight="700" fill="#C08A2E">25%</text>
    <rect x="636" y="438" width="176" height="72" rx="8" fill="#FFFFFF" stroke="#DADFD9"/><text x="724" y="466">学生评委</text><text x="724" y="488" font-size="18" font-weight="700" fill="#C08A2E">10%</text>
    <rect x="836" y="438" width="304" height="72" rx="8" fill="#F8EFDF" stroke="#C08A2E"/><text x="988" y="466">第 5 次调用：只写评语</text><text x="988" y="488" font-size="11.5" fill="#8A5A1E">不改分；违规时四评委全 0 并跳过</text>
  </g>
  <line x1="236" y1="474" x2="248" y2="474" stroke="#C08A2E" stroke-width="1.6"/>
  <line x1="428" y1="474" x2="440" y2="474" stroke="#C08A2E" stroke-width="1.6"/>
  <line x1="620" y1="474" x2="632" y2="474" stroke="#C08A2E" stroke-width="1.6"/>
  <line x1="812" y1="474" x2="832" y2="474" stroke="#C08A2E" stroke-width="2" marker-end="url(#t3)"/>

  <text x="60" y="560" font-family="Microsoft YaHei, sans-serif" font-size="13.5" fill="#2A3648">每位评委看到：病例事实 · 教师量规（8 问 16 维）· 实际对话；各自独立打分，服务端按量规上限截断并保留"量规小计"。</text>
  <text x="60" y="590" font-family="Microsoft YaHei, sans-serif" font-size="13.5" fill="#2A3648">分数只写证据日志；档案里的问诊记录由前端另行保存，排行榜只统计全双工模式。</text>
</svg>
